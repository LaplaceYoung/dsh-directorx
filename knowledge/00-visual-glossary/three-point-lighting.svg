<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420">
  <title>Three-Point Lighting 三点布光</title>
  <desc>俯视图：主光 45 度侧向照亮主体，辅光在对侧较弱，背光在后方勾轮廓。</desc>
  <rect width="640" height="420" fill="#101018"/>
  <!-- 地板网格 -->
  <line x1="0" y1="210" x2="640" y2="210" stroke="#26263a" stroke-width="1"/>
  <line x1="320" y1="0" x2="320" y2="420" stroke="#26263a" stroke-width="1"/>
  <!-- 主体 -->
  <circle cx="320" cy="210" r="34" fill="#3a3a5a" stroke="#9ad0ff" stroke-width="3"/>
  <text x="296" y="216" fill="#fff" font-size="20" font-family="sans-serif">主体</text>
  <!-- 主光 -->
  <circle cx="150" cy="120" r="26" fill="#ffd166" stroke="#fff" stroke-width="3"/>
  <line x1="172" y1="137" x2="296" y2="196" stroke="#ffd166" stroke-width="4" stroke-dasharray="6 6"/>
  <text x="118" y="100" fill="#ffd166" font-size="18" font-family="sans-serif">Key 主光 45°</text>
  <!-- 辅光 -->
  <circle cx="150" cy="300" r="20" fill="#70c1ff" stroke="#fff" stroke-width="3"/>
  <line x1="168" y1="286" x2="296" y2="224" stroke="#70c1ff" stroke-width="3" stroke-dasharray="5 5"/>
  <text x="118" y="330" fill="#70c1ff" font-size="18" font-family="sans-serif">Fill 辅光 ≤50%</text>
  <!-- 背光 -->
  <circle cx="490" cy="210" r="20" fill="#fff" stroke="#fff" stroke-width="3"/>
  <line x1="472" y1="210" x2="358" y2="210" stroke="#fff" stroke-width="3" stroke-dasharray="5 5"/>
  <text x="480" y="196" fill="#fff" font-size="18" font-family="sans-serif">Back 背光</text>
  <!-- 相机 -->
  <text x="600" y="230" fill="#8a8ab0" font-size="18" font-family="sans-serif">Camera</text>
  <polygon points="600,205 580,210 600,215" fill="#8a8ab0"/>
</svg>