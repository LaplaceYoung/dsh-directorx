name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ffmpeg -hide_banner -version | head -n 1
      - run: npm ci
      - run: npm test
      - name: lib/ matches the green build
        run: git diff --exit-code lib/
